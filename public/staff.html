<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alliance CRM — Staff Management</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <span class="brand">Alliance CRM</span>
    <nav id="nav"></nav>
  </header>
  <main>
    <h1>Staff Management</h1>
    <div id="pageMsg" class="note">This page is intended for the Executive Director (admin) only.</div>

    <div class="card">
      <h2>Staff accounts</h2>
      <table id="staffList"><thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card" id="createCard">
      <h2>Add staff member</h2>
      <div id="createMsg"></div>
      <form id="createForm">
        <div class="row">
          <div><label>Username</label><input name="username" required></div>
          <div><label>Full name</label><input name="full_name"></div>
        </div>
        <div class="row">
          <div><label>Email</label><input name="email"></div>
          <div><label>Role</label>
            <select name="role">
              <option value="admin">admin</option>
              <option value="program_manager">program_manager</option>
              <option value="intake">intake</option>
              <option value="peer_support">peer_support</option>
              <option value="volunteer">volunteer</option>
            </select>
          </div>
        </div>
        <label>Password</label><input name="password" required>
        <br><br>
        <button type="submit">Create staff</button>
      </form>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    if (requireLogin()) {
      renderHeader();
      const user = getUser();
      // UI-side gate: non-admins are told this is admin-only. (The API gate on
      // create/delete is real; viewing the list is not restricted server-side.)
      if (user.role !== 'admin') {
        document.getElementById('pageMsg').className = 'msg err';
        document.getElementById('pageMsg').textContent =
          'Your role (' + user.role + ') is not an administrator. Staff creation/deletion will be rejected by the server.';
      }

      async function loadStaff() {
        try {
          const r = await api('/api/users'); // not role-restricted server-side
          const tb = document.querySelector('#staffList tbody');
          tb.innerHTML = '';
          r.rows.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>' + s.id + '</td><td>' + s.username + '</td><td>' + (s.full_name||'') +
              '</td><td>' + (s.email||'') + '</td><td>' + s.role + '</td>' +
              '<td><button class="danger" data-id="' + s.id + '">delete</button></td>';
            tb.appendChild(tr);
          });
          tb.querySelectorAll('button[data-id]').forEach(b =>
            b.addEventListener('click', async () => {
              try { await api('/api/users/' + b.dataset.id, { method: 'DELETE' }); loadStaff(); }
              catch (e) { alert(e.message); }
            }));
        } catch (err) {
          document.querySelector('#staffList tbody').innerHTML =
            '<tr><td colspan="6">' + err.message + '</td></tr>';
        }
      }
      loadStaff();

      document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = Object.fromEntries(new FormData(e.target).entries());
        try {
          await api('/api/users', { method: 'POST', body: JSON.stringify(payload) });
          msg('createMsg', 'Staff member created.', 'ok');
          loadStaff();
        } catch (err) { msg('createMsg', err.message, 'err'); }
      });
    }
  </script>
</body>
</html>
