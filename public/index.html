<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alliance CRM — Veteran Intake</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <span class="brand">Alliance Veteran Wellness</span>
    <nav id="nav"></nav>
  </header>
  <main>
    <h1>Request Services</h1>
    <p class="muted">Alliance is a nonprofit supporting veteran wellness. Fill out this form and our
      intake team will reach out. All information is confidential.</p>

    <div class="card">
      <div id="formMsg"></div>
      <form id="intakeForm">
        <label>Full name *</label>
        <input name="name" required>
        <div class="row">
          <div><label>Email</label><input name="email" type="email"></div>
          <div><label>Phone</label><input name="phone"></div>
        </div>
        <label>How did you hear about us?</label>
        <select name="referral_source">
          <option>Self-referral</option>
          <option>VA Hospital</option>
          <option>Community Partner</option>
          <option>Shelter Staff</option>
          <option>Family Member</option>
          <option>Online Form</option>
        </select>
        <label>What do you need help with?</label>
        <select name="service_needs">
          <option>Housing assistance</option>
          <option>Employment help</option>
          <option>Benefits claim</option>
          <option>Counselling referral</option>
          <option>Food security</option>
          <option>Transportation</option>
        </select>
        <label>Anything else you'd like us to know?</label>
        <textarea name="notes"></textarea>
        <br><br>
        <button type="submit">Submit request</button>
      </form>
    </div>
    <p class="muted">Staff? <a href="/portal.html">Log in to the portal</a>.</p>
  </main>
  <script src="/app.js"></script>
  <script>
    renderHeader();
    document.getElementById('intakeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      try {
        const r = await api('/api/intake', { method: 'POST', body: JSON.stringify(payload) });
        msg('formMsg', r.message || 'Submitted. Thank you.', 'ok');
        e.target.reset();
      } catch (err) {
        msg('formMsg', err.message, 'err');
      }
    });
  </script>
</body>
</html>
